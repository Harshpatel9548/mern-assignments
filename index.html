<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website | Home</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .hero {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: #fff;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
    }

    .logo {
      color: inherit;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: rgb(255 255 255 / 85%);
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-button {
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #1d4ed8;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-button:hover {
      background: #dbeafe;
    }

    .banner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 380px;
      padding: 2rem;
      color: inherit;
      text-align: center;
    }

    .banner h1 {
      margin: 0 0 0.75rem;
    }

    .banner p {
      margin: 0;
      color: rgb(255 255 255 / 85%);
      line-height: 1.6;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 2rem;
    }

    .card {
      flex: 1 1 200px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgb(0 0 0 / 5%);
    }

    .card h2 {
      margin: 0 0 0.75rem;
      color: #172554;
      font-size: 1.2rem;
    }

    .card p {
      margin: 0;
      color: #475569;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .navbar {
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1rem;
      }

      .nav-right {
        width: 100%;
        gap: 0.75rem;
        justify-content: space-between;
      }

      .nav-links {
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="#" aria-label="My Website home">My Website</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
        </ul>
        <button class="nav-button" type="button">Get started</button>
      </div>
    </nav>
    <section class="banner" aria-labelledby="banner-heading">
      <h1 id="banner-heading">Welcome to My Website</h1>
      <p>Discover what we have to offer.</p>
    </section>
  </header>
  <main>
    <section class="card-row" aria-label="Featured topics">
      <article class="card">
        <h2>Getting Started</h2>
        <p>Find the essentials to help you get started.</p>
      </article>
      <article class="card">
        <h2>Our Services</h2>
        <p>Explore the services and resources available to you.</p>
      </article>
      <article class="card">
        <h2>Learn More</h2>
        <p>Discover more about what makes us unique.</p>
      </article>
    </section>
  </main>
</body>
</html>
