<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <style>
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "head head"
        "side main"
        "foot foot";
      gap: 16px;
    }

    .head {
      grid-area: head;
    }

    .side {
      grid-area: side;
    }

    .grid {
      grid-area: main;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    .foot {
      grid-area: foot;
    }

    .grid-item {
      padding: 24px;
      background: #dbeafe;
      border-radius: 8px;
      text-align: center;
      font: 600 1.25rem sans-serif;
    }

    .head,
    .side,
    .foot {
      padding: 16px;
      background: #f3f4f6;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "head"
          "side"
          "main"
          "foot";
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="head">Header</header>
    <aside class="side">Sidebar</aside>
    <main class="grid">
      <div class="grid-item">One</div>
      <div class="grid-item">Two</div>
      <div class="grid-item">Three</div>
      <div class="grid-item">Four</div>
      <div class="grid-item">Five</div>
      <div class="grid-item">Six</div>
    </main>
    <footer class="foot">Footer</footer>
  </div>
</body>
</html>
